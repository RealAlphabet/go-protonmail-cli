<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtonMail Client</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto px-4 py-8">
        <!-- Login Form -->
        <div id="loginForm" class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-4">Connexion ProtonMail</h2>
            <form id="login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div id="captchaContainer">
                    <label class="block text-sm font-medium text-gray-700">CAPTCHA Token</label>
                    <input type="text" id="captchaToken" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <a id="captchaUrl" href="#" target="_blank" class="text-indigo-600 hover:text-indigo-500 text-sm">Open CAPTCHA</a>
                </div>
                <div id="totpContainer">
                    <label class="block text-sm font-medium text-gray-700">TOTP Code</label>
                    <input type="text" id="totpCode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div id="totpSecretContainer">
                    <label class="block text-sm font-medium text-gray-700">TOTP Secret</label>
                    <input type="text" id="totpSecret" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Se connecter
                </button>
            </form>
        </div>

        <!-- Email List -->
        <div id="emailList" class="hidden max-w-4xl mx-auto mt-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Emails</h2>
                <button id="logout" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">
                    Déconnexion
                </button>
            </div>
            <div class="bg-white shadow overflow-hidden sm:rounded-md">
                <ul id="emails" class="divide-y divide-gray-200"></ul>
            </div>
            <div class="mt-4 flex justify-between">
                <button id="prevPage" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                    Précédent
                </button>
                <button id="nextPage" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                    Suivant
                </button>
            </div>
        </div>

        <!-- Email View -->
        <div id="emailView" class="hidden max-w-4xl mx-auto mt-8 bg-white rounded-lg shadow-md p-6">
            <button id="backToList" class="mb-4 text-indigo-600 hover:text-indigo-500">← Retour à la liste</button>
            <h3 id="emailSubject" class="text-xl font-bold mb-2"></h3>
            <div class="text-sm text-gray-600 mb-4">
                De: <span id="emailSender"></span>
                <br>
                Date: <span id="emailDate"></span>
            </div>
            <div id="emailContent" class="prose max-w-none"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
